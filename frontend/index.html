<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой аккаунт</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Мой аккаунт</h1>
    <p class="label">Ваш ID</p>
    <p id="user-id" class="value">Загрузка…</p>
    <p class="label">Код доступа</p>
    <div id="code-box" class="code-box" aria-live="polite">Загрузка…</div>
    <button id="show-code" type="button" hidden>Показать код</button>
    <button id="copy-code" type="button" hidden>Скопировать код</button>
    <button id="rotate" type="button">Перевыпустить код</button>
    <button id="open-login" type="button" class="secondary">Войти в существующий аккаунт</button>
    <form id="login-form" hidden>
      <label for="login-code">Код доступа</label>
      <input id="login-code" name="code" type="text" autocomplete="off" required maxlength="256">
      <div class="actions">
        <button type="submit">Войти</button>
        <button id="cancel-login" type="button" class="secondary">Отмена</button>
      </div>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
